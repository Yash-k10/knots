# Ruff Linter Configuration
# Ref: https://docs.astral.sh/ruff/configuration/

[lint]
# Check Pyflakes (F) and pycodestyle (E, W) by default
select = ["E", "F", "W"]

# Ignore line too long, imports not at top of file, and boolean equality checks
ignore = ["E501", "E402", "E712"]

# Ignore unused imports in __init__.py files
per-file-ignores = { "__init__.py" = ["F401"] }
