services:
  # Backend Web Service
  - type: web
    name: knots-backend
    runtime: python
    region: oregon
    plan: free
    branch: develop
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production

  # Frontend Static Site
  - type: web
    name: knots-frontend
    runtime: static
    region: oregon
    plan: free
    branch: develop
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
